name: LifeUI
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
  configs:
    debug:
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
packages:
  LifeKit:
    path: ../../packages/LifeKit
targets:
  LifeUI:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: LifeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmiller.life-ui
        PRODUCT_NAME: LifeUI
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Life UI
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.alexmiller.life-ui.open
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [life]
  LifeUITests:
    type: bundle.unit-test
    platform: iOS
    sources: [../../packages/LifeKit/Tests/LifeKitTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmiller.life-ui.tests
        PRODUCT_NAME: LifeUITests
    dependencies:
      - target: LifeUI
      - package: LifeKit
  LifeUIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmiller.life-ui.uitests
        PRODUCT_NAME: LifeUIUITests
    dependencies:
      - target: LifeUI
schemes:
  LifeUI:
    build:
      targets:
        LifeUI: all
        LifeUITests: [test]
        LifeUIUITests: [test]
    test:
      targets: [LifeUITests, LifeUIUITests]
