name: Iris
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: 1
    IRIS_APP_BUNDLE_IDENTIFIER: com.alexmiller.iris
    IRIS_WIDGET_APP_GROUP: group.$(IRIS_APP_BUNDLE_IDENTIFIER)
  configs:
    debug:
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
packages:
  IrisKit:
    path: ../../packages/IrisKit
  # Shared tests import GRDB directly; same requirement as IrisKit's manifest.
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0
targets:
  Iris:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: IrisKit
      - package: IrisKit
        product: IrisWidgetSupport
      - target: IrisWidgets
        embed: true
      - target: IrisShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IRIS_APP_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: Iris
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Signing/Iris.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        # App and extensions take Ad Hoc profiles; package resource bundles cannot.
        # scripts/sign-ios.py sets IOS_PROFILE and IOS_<BUNDLE SUFFIX>_PROFILE.
        release:
          PROVISIONING_PROFILE_SPECIFIER: ${IOS_PROFILE}
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Iris
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        IrisWidgetAppGroup: $(IRIS_WIDGET_APP_GROUP)
        # The hub's silent change push runs one sync round in the background.
        UIBackgroundModes: [remote-notification]
        CFBundleURLTypes:
          - CFBundleURLName: com.alexmiller.iris.open
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [iris]
  IrisWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets]
    dependencies:
      - package: IrisKit
        product: IrisWidgetSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IRIS_APP_BUNDLE_IDENTIFIER).widgets
        PRODUCT_NAME: IrisWidgets
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Signing/Extension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        release:
          PROVISIONING_PROFILE_SPECIFIER: ${IOS_WIDGETS_PROFILE}
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Iris Widgets
        IrisWidgetAppGroup: $(IRIS_WIDGET_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  IrisShare:
    type: app-extension
    platform: iOS
    sources: [Share]
    dependencies:
      - package: IrisKit
        product: IrisExtensionSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IRIS_APP_BUNDLE_IDENTIFIER).share
        PRODUCT_NAME: IrisShare
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Signing/Extension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        release:
          PROVISIONING_PROFILE_SPECIFIER: ${IOS_SHARE_PROFILE}
    info:
      path: Share/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Iris
        IrisWidgetAppGroup: $(IRIS_WIDGET_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
  IrisTests:
    type: bundle.unit-test
    platform: iOS
    sources: [../../packages/IrisKit/Tests/IrisKitTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmiller.iris.tests
        PRODUCT_NAME: IrisTests
    dependencies:
      - target: Iris
      - package: IrisKit
      - package: IrisKit
        product: IrisWidgetSupport
      - package: GRDB
  IrisUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmiller.iris.uitests
        PRODUCT_NAME: IrisUITests
    dependencies:
      - target: Iris
schemes:
  Iris:
    build:
      targets:
        Iris: all
        # Listed so -showBuildSettings exposes them to scripts/sign-ios.py.
        IrisWidgets: all
        IrisShare: all
        IrisTests: [test]
        IrisUITests: [test]
    test:
      targets: [IrisTests, IrisUITests]
