name: LifeUI
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
  configs:
    debug:
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
packages:
  LifeKit:
    path: ../../packages/LifeKit
targets:
  LifeUI:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: LifeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmiller.life-ui
        PRODUCT_NAME: LifeUI
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Life UI
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Signing/LifeUI.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.alexmiller.life-ui.open
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [life]
  LifeUITests:
    type: bundle.unit-test
    platform: macOS
    sources: [../../packages/LifeKit/Tests/LifeKitTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmiller.life-ui.tests
        PRODUCT_NAME: LifeUITests
    dependencies:
      - target: LifeUI
      - package: LifeKit
  LifeUIUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmiller.life-ui.uitests
        PRODUCT_NAME: LifeUIUITests
    dependencies:
      - target: LifeUI
schemes:
  LifeUI:
    build:
      targets:
        LifeUI: all
        LifeUITests: [test]
        LifeUIUITests: [test]
    test:
      targets: [LifeUITests, LifeUIUITests]
