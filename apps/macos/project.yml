name: Iris
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
  configs:
    debug:
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
packages:
  IrisKit:
    path: ../../packages/IrisKit
  # Shared tests import GRDB directly; same requirement as IrisKit's manifest.
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0
targets:
  Iris:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: IrisKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmiller.iris
        PRODUCT_NAME: Iris
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Iris
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Signing/Iris.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.alexmiller.iris.open
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [iris]
  IrisTests:
    type: bundle.unit-test
    platform: macOS
    sources: [../../packages/IrisKit/Tests/IrisKitTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmiller.iris.tests
        PRODUCT_NAME: IrisTests
    dependencies:
      - target: Iris
      - package: IrisKit
      - package: IrisKit
        product: IrisWidgetSupport
      - package: GRDB
  IrisUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmiller.iris.uitests
        PRODUCT_NAME: IrisUITests
    dependencies:
      - target: Iris
schemes:
  Iris:
    build:
      targets:
        Iris: all
        IrisTests: [test]
        IrisUITests: [test]
    test:
      targets: [IrisTests, IrisUITests]
