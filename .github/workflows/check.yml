name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun scripts/test-opfs-reopen.ts --verify-patch
      - run: bun run check:contract
      - name: Verify generated native resources
        run: |
          bun scripts/test-island-builds.ts
          bun run bundle:graph
          bun run bundle:editor
          bun run bundle:native
          bun run bundle:export --check
          git diff --exit-code -- packages/LifeKit/Sources/LifeKit/Resources/graph.html packages/LifeKit/Sources/LifeKit/Resources/editor.html packages/LifeKit/Sources/LifeKit/Resources/life-core.js
      - run: bun run test
      - name: Governance presentation boundaries
        run: |
          bun test scripts/governance-review.test.ts scripts/governance-approval.test.ts scripts/governance-journal.test.ts scripts/governance-list.test.ts scripts/governance-panel.test.ts scripts/governance-service-binding.test.ts
          bun scripts/check-governance-boundaries.ts
          bun --conditions=browser scripts/check-governance-panel-dom.ts
      - run: bun run check
      - run: bun run --cwd apps/web lint
      - name: Keyboard and axe accessibility walk (light and dark)
        timeout-minutes: 10
        run: bun scripts/check-a11y.ts
      - run: bun run build
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun test scripts/release-macos.test.ts scripts/ios-ci.test.ts scripts/ios-ota.test.ts
      - run: python3 scripts/test-nix-migration.py
      - run: python3 scripts/macos_signing_test.py
      - run: python3 scripts/sign_ios_test.py
      - run: brew install xcodegen just
      - run: swift test --no-parallel --package-path packages/LifeKit
      - name: Interrupted native attachment staging
        timeout-minutes: 2
        run: python3 scripts/test-attachment-staging.py
      - name: Catalog record XCUI acceptance (clean runner)
        timeout-minutes: 12
        run: |
          set -euo pipefail
          fixture_dir="$(mktemp -d "$RUNNER_TEMP/catalog-ui.XXXXXX")"
          fixture="$fixture_dir/catalog-acceptance.sqlite"
          LIFE_UI_TEST_CATALOG_DATABASE="$fixture" swift test \
            --package-path packages/LifeKit --skip-build \
            --filter CatalogRecordAcceptanceTests.prepareCatalogRecordUIFixture \
            2>&1 | tee "$RUNNER_TEMP/catalog-fixture.log"
          test -s "$fixture"
          presentation="$fixture_dir/presentation-acceptance.sqlite"
          LIFE_UI_TEST_PRESENTATION_DATABASE="$presentation" swift test \
            --package-path packages/LifeKit --skip-build \
            --filter PresentationTests.preparePresentationUIFixture \
            2>&1 | tee "$RUNNER_TEMP/presentation-fixture.log"
          test -s "$presentation"
          filter_bar="$fixture_dir/filter-bar.sqlite"
          cp "$presentation" "$filter_bar"
          references="$fixture_dir/reference-create.sqlite"
          bun scripts/reference-create-fixture.ts "$references"
          test -s "$references"
          (cd apps/macos && xcodegen generate --spec project.yml)
          TEST_RUNNER_LIFE_UI_TEST_CATALOG_DATABASE="$fixture" \
          TEST_RUNNER_LIFE_UI_TEST_PRESENTATION_DATABASE="$presentation" \
          TEST_RUNNER_LIFE_UI_TEST_FILTER_BAR_DATABASE="$filter_bar" \
          TEST_RUNNER_LIFE_UI_TEST_REFERENCE_CREATE_DATABASE="$references" \
          TEST_RUNNER_LIFE_UI_TEST_CATALOG_CLEAN_HOST=1 \
            xcodebuild -project apps/macos/LifeUI.xcodeproj -scheme LifeUI \
              -derivedDataPath "$RUNNER_TEMP/catalog-derived" -destination 'platform=macOS' \
              -resultBundlePath "$RUNNER_TEMP/catalog-ui.xcresult" \
              -only-testing:LifeUIUITests/CatalogRecordUITests/testCatalogRuleFailureRetainsDraftAndReadOnlyMetadata \
              -only-testing:LifeUIUITests/PresentationUITests/testCalendarRangesGalleryAndBoardMove \
              -only-testing:LifeUIUITests/FilterBarUITests/testHeaderChipSortUndoAndRelaunch \
              -only-testing:LifeUIUITests/CatalogEditorUITests/testCatalogEditRetainsInvalidDraftAndRefreshesRecordMetadata \
              -only-testing:LifeUIUITests/RelatedViewsUITests/testMainAndRelatedPreferencesStayIndependentThroughUserControls \
              -only-testing:LifeUIUITests/SidebarMenuBarUITests/testCommandBackslashTogglesPersistedSidebarAndMenuBarItemOpensQuickFind \
              -only-testing:LifeUIUITests/ReferenceCreateUITests/testPickersCreateRecordsInPlaceAndHandRequiredFieldsToTheEditor \
              -test-timeouts-enabled YES -maximum-test-execution-time-allowance 120 \
              CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/catalog-xcui.log"
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/catalog-ui.xcresult" \
            > "$RUNNER_TEMP/catalog-xcui-summary.json"
          python3 - "$RUNNER_TEMP/catalog-xcui-summary.json" <<'PYVERIFY'
          import json
          import pathlib
          import sys

          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if (result.get("passedTests"), result.get("failedTests"), result.get("skippedTests")) != (7, 0, 0):
              raise SystemExit(f"Expected seven executed passing XCUI tests: {result}")
          print("Verified catalog, presentation, filter-bar, related-view, sidebar/menu-bar and reference-create XCUI tests; no skipped or zero-test success")
          PYVERIFY
      - name: Keep the synthetic Mac XCUI screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-xcui-screens
          path: ${{ runner.temp }}/catalog-ui.xcresult
          retention-days: 3
      - name: Preserve synthetic catalog failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-xcui-failure
          path: |
            ${{ runner.temp }}/catalog-xcui.log
            ${{ runner.temp }}/catalog-fixture.log
            ${{ runner.temp }}/presentation-fixture.log
            ${{ runner.temp }}/catalog-ui.xcresult
          retention-days: 3
          if-no-files-found: ignore
      - name: Catalog record iOS XCUI acceptance (private simulator)
        timeout-minutes: 25
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/catalog-devices.json"
          read -r runtime device_type < <(python3 - "$RUNNER_TEMP/catalog-devices.json" <<'PYDEVICE'
          import json, pathlib, sys
          devices = json.loads(pathlib.Path(sys.argv[1]).read_text())["devices"]
          for runtime, values in devices.items():
              for device in values:
                  if ".iOS-" in runtime and device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(runtime, device["deviceTypeIdentifier"])
                      raise SystemExit(0)
          raise SystemExit("No installed iPhone simulator runtime")
          PYDEVICE
          )
          simulator="$(xcrun simctl create "Catalog acceptance $GITHUB_RUN_ID" "$device_type" "$runtime")"
          printf '%s' "$simulator" > "$RUNNER_TEMP/catalog-simulator-id"
          trap 'xcrun simctl shutdown "$simulator" >/dev/null 2>&1 || true; xcrun simctl delete "$simulator"' EXIT
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b
          (cd apps/ios && xcodegen generate --spec project.yml)
          export TEST_RUNNER_LIFE_UI_TEST_CATALOG_SIMULATOR="$simulator"
          xcodebuild -project apps/ios/LifeUI.xcodeproj -scheme LifeUI \
            -derivedDataPath "$RUNNER_TEMP/catalog-ios-derived" \
            -destination "platform=iOS Simulator,id=$simulator" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/catalog-ios-seed.xcresult" \
            '-only-testing:LifeUITests/CatalogRecordAcceptanceTests/prepareCatalogRecordUIFixture()' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES \
            test 2>&1 | tee "$RUNNER_TEMP/catalog-ios-seed.log"
          xcodebuild -project apps/ios/LifeUI.xcodeproj -scheme LifeUI \
            -derivedDataPath "$RUNNER_TEMP/catalog-ios-derived" \
            -destination "platform=iOS Simulator,id=$simulator" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/catalog-ios-ui.xcresult" \
            -only-testing:LifeUIUITests/RecordPolishUITests/testCatalogRuleFailureRetainsDraftAndReadOnlyMetadata \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES \
            test-without-building 2>&1 | tee "$RUNNER_TEMP/catalog-ios-xcui.log"
          for result in catalog-ios-seed catalog-ios-ui; do
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/$result.xcresult" > "$RUNNER_TEMP/$result.json"
            python3 - "$RUNNER_TEMP/$result.json" <<'PYVERIFY'
          import json, pathlib, sys
          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if (result.get("passedTests"), result.get("failedTests"), result.get("skippedTests")) != (1, 0, 0):
              raise SystemExit(f"Expected one executed passing test: {result}")
          print("Verified exactly one executed test with no skips")
          PYVERIFY
          done
          bash scripts/test-quick-add-ios.sh apps/ios/LifeUI.xcodeproj \
            "$RUNNER_TEMP/catalog-ios-derived" "$simulator" "$RUNNER_TEMP"
      - name: Preserve synthetic iOS catalog failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-ios-xcui-failure
          path: |
            ${{ runner.temp }}/catalog-ios-*.log
            ${{ runner.temp }}/catalog-ios-*.xcresult
            ${{ runner.temp }}/quick-add-*.log
            ${{ runner.temp }}/quick-add-*.xcresult
          retention-days: 3
          if-no-files-found: ignore
      # Accessibility audits run even when a sibling XCUI step failed, so their
      # verdict and evidence (element trees, AX5 screenshots) are always reported.
      - name: Accessibility audit XCUI (Mac, keyboard)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          set -euo pipefail
          (cd apps/macos && xcodegen generate --spec project.yml)
          xcodebuild -project apps/macos/LifeUI.xcodeproj -scheme LifeUI \
            -derivedDataPath "$RUNNER_TEMP/catalog-derived" -destination 'platform=macOS' \
            -resultBundlePath "$RUNNER_TEMP/a11y-mac.xcresult" \
            -only-testing:LifeUIUITests/AccessibilityAuditUITests \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/a11y-mac.log"
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/a11y-mac.xcresult" \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); c=(r.get("passedTests"),r.get("failedTests"),r.get("skippedTests")); sys.exit(f"Expected one passing Mac audit: {r}") if c!=(1,0,0) else print("Mac accessibility audit passed")'
      - name: Accessibility audit XCUI (iPhone, AX5 text)
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          runtime_type="$(xcrun simctl list devices available --json | python3 -c 'import json,sys
          for runtime, values in json.load(sys.stdin)["devices"].items():
              for d in values:
                  if ".iOS-" in runtime and d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      print(runtime, d["deviceTypeIdentifier"]); raise SystemExit(0)
          raise SystemExit("No installed iPhone simulator runtime")')"
          read -r runtime device_type <<< "$runtime_type"
          simulator="$(xcrun simctl create "Accessibility audit $GITHUB_RUN_ID" "$device_type" "$runtime")"
          trap 'xcrun simctl shutdown "$simulator" >/dev/null 2>&1 || true; xcrun simctl delete "$simulator"' EXIT
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b
          (cd apps/ios && xcodegen generate --spec project.yml)
          xcodebuild -project apps/ios/LifeUI.xcodeproj -scheme LifeUI \
            -derivedDataPath "$RUNNER_TEMP/catalog-ios-derived" \
            -destination "platform=iOS Simulator,id=$simulator" -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/a11y-ios.xcresult" \
            -only-testing:LifeUIUITests/AccessibilityAuditUITests \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 600 \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES \
            test 2>&1 | tee "$RUNNER_TEMP/a11y-ios.log"
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/a11y-ios.xcresult" \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); c=(r.get("passedTests"),r.get("failedTests"),r.get("skippedTests")); sys.exit(f"Expected two passing iPhone audits: {r}") if c!=(2,0,0) else print("iPhone accessibility audits passed")'
      - name: Keep the accessibility audit evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-audit
          path: |
            ${{ runner.temp }}/a11y-*.log
            ${{ runner.temp }}/a11y-*.xcresult
          retention-days: 7
          if-no-files-found: ignore
