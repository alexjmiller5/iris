name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun scripts/test-opfs-reopen.ts --verify-patch
      - run: bun run check:contract
      - name: Verify generated native resources
        run: |
          bun scripts/test-island-builds.ts
          bun run bundle:graph
          bun run bundle:editor
          bun run bundle:native
          bun run bundle:export --check
          git diff --exit-code -- packages/LifeKit/Sources/LifeKit/Resources/graph.html packages/LifeKit/Sources/LifeKit/Resources/editor.html packages/LifeKit/Sources/LifeKit/Resources/life-core.js
      - run: bun run test
      - name: Governance presentation boundaries
        run: |
          bun test scripts/governance-review.test.ts scripts/governance-approval.test.ts scripts/governance-journal.test.ts scripts/governance-list.test.ts scripts/governance-panel.test.ts scripts/governance-service-binding.test.ts
          bun scripts/check-governance-boundaries.ts
          bun --conditions=browser scripts/check-governance-panel-dom.ts
      - run: bun run check
      - run: bun run --cwd apps/web lint
      - run: bun run build
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun test scripts/release-macos.test.ts scripts/ios-ci.test.ts scripts/ios-ota.test.ts
      - run: python3 scripts/macos_signing_test.py
      - run: python3 scripts/sign_ios_test.py
      - run: brew install xcodegen just
      - run: swift test --package-path packages/LifeKit
      - name: Hosted catalog acceptance (synthetic opt-in)
        timeout-minutes: 3
        env:
          LIFE_UI_TEST_CATALOG_HOSTED: "1"
        run: |
          set -o pipefail
          swift test --package-path packages/LifeKit --skip-build \
            --filter CatalogRecordAcceptanceTests.hostedCatalogRuleFailureRetainsDraftAndMetadata \
            2>&1 | tee "$RUNNER_TEMP/catalog-hosted.log"
          python3 - "$RUNNER_TEMP/catalog-hosted.log" <<'PY'
          import pathlib
          import re
          import sys

          output = pathlib.Path(sys.argv[1]).read_text()
          output = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", output)
          name = r"hostedCatalogRuleFailureRetainsDraftAndMetadata\(\)"
          required = [
              rf"\bTest {name} started\.",
              rf"\bTest {name} passed after ",
              r"\bTest run with 1 test in 1 suite passed after ",
          ]
          if any(re.search(pattern, output) is None for pattern in required):
              raise SystemExit("Hosted acceptance did not execute and pass exactly one test")
          if re.search(rf"\bTest {name}[^\n]*skipped", output, re.IGNORECASE):
              raise SystemExit("Hosted acceptance was skipped")
          print("Verified one executed hosted catalog test; not XCUI or installed-app acceptance")
          PY
      - run: just --justfile apps/macos/justfile check
      - run: just --justfile apps/ios/justfile check
