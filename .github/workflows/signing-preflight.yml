name: Signing provisioning preflight
on:
  push:
    branches: [fix/macos-keychain-entitlements]
permissions:
  contents: read
jobs:
  permissions:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: 1Password/install-cli-action@v4
      - uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DEVELOPER_ID_P12_BASE64: op://Apple Signing/Developer ID Application Cert/p12_base64
          DEVELOPER_ID_P12_PASSWORD: op://Apple Signing/Developer ID Application Cert/password
          ASC_KEY_P8_BASE64: op://Apple Signing/App Store Connect API Key/p8_base64
          ASC_KEY_ID: op://Apple Signing/App Store Connect API Key/key_id
          ASC_ISSUER_ID: op://Apple Signing/App Store Connect API Key/issuer_id
      - name: Verify provisioning API access without exposing account data
        run: |
          bun - <<'JS'
          const { createPrivateKey, sign } = require('node:crypto');
          const encode = value => Buffer.from(JSON.stringify(value)).toString('base64url');
          const now = Math.floor(Date.now()/1000);
          const payload = encode({alg:'ES256',kid:process.env.ASC_KEY_ID,typ:'JWT'})+'.'+encode({iss:process.env.ASC_ISSUER_ID,iat:now,exp:now+120,aud:'appstoreconnect-v1'});
          const key = createPrivateKey(Buffer.from(process.env.ASC_KEY_P8_BASE64,'base64'));
          const jwt = payload+'.'+sign('sha256',Buffer.from(payload),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');
          for (const resource of ['profiles','bundleIds','certificates']) {
            const response = await fetch('https://api.appstoreconnect.apple.com/v1/'+resource+'?limit=1',{headers:{Authorization:'Bearer '+jwt}});
            console.log(resource+': HTTP '+response.status);
            if (!response.ok) process.exitCode=1;
          }
          JS
      - name: Prove automatic Developer ID provisioning and real DP Keychain
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/life-ui-release.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          trap 'rm -f "$RUNNER_TEMP/life-ui-cert.p12" "$RUNNER_TEMP/life-ui-notary.p8"' EXIT
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 -d > "$RUNNER_TEMP/life-ui-cert.p12"
          security import "$RUNNER_TEMP/life-ui-cert.p12" -k "$KEYCHAIN" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S 'apple-tool:,apple:' -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          test -n "$IDENTITY"
          IDENTITY_SHA=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ {print $2; exit}')
          [[ "$IDENTITY_SHA" =~ ^[A-Fa-f0-9]{40}$ ]]
          TEAM_ID=$(printf '%s' "$IDENTITY" | sed -nE 's/.*\(([A-Z0-9]{10})\)$/\1/p')
          [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/life-ui-notary.p8"
          # One app-owned profile against the already imported certificate only.
          # No certificate creation endpoint is used.
          IDENTITY_SHA="$IDENTITY_SHA" bun - <<'JS'
          const {createPrivateKey,sign,X509Certificate}=require('node:crypto');
          const encode=v=>Buffer.from(JSON.stringify(v)).toString('base64url');
          const now=Math.floor(Date.now()/1000);
          const input=encode({alg:'ES256',kid:process.env.ASC_KEY_ID,typ:'JWT'})+'.'+encode({iss:process.env.ASC_ISSUER_ID,iat:now,exp:now+300,aud:'appstoreconnect-v1'});
          const key=createPrivateKey(Buffer.from(process.env.ASC_KEY_P8_BASE64,'base64'));
          const jwt=input+'.'+sign('sha256',Buffer.from(input),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');
          async function api(path,data) {
            const response=await fetch('https://api.appstoreconnect.apple.com/v1/'+path,{method:data?'POST':'GET',headers:{Authorization:'Bearer '+jwt,'Content-Type':'application/json'},body:data?JSON.stringify({data}):undefined});
            const result=await response.json();
            console.log((data?'POST ':'GET ')+path.split('?')[0]+': HTTP '+response.status);
            if(!response.ok) { console.log('API error codes:',(result.errors??[]).map(e=>e.code).join(','));process.exit(1); }
            return result;
          }
          const bundle='com.alexmiller.life-ui';
          const certs=await api('certificates?filter[certificateType]=DEVELOPER_ID_APPLICATION,DEVELOPER_ID_APPLICATION_G2&limit=200');
          const matches=certs.data.filter(c=>new X509Certificate(Buffer.from(c.attributes.certificateContent,'base64')).fingerprint.replaceAll(':','').toUpperCase()===process.env.IDENTITY_SHA.toUpperCase());
          if(matches.length!==1) throw Error('Expected exactly one existing certificate match');
          const cert=matches[0];
          const ids=await api('bundleIds?filter[identifier]='+bundle+'&filter[platform]=MAC_OS&limit=200');
          if(ids.data.length>1) throw Error('Ambiguous app identity');
          const app=ids.data[0]??(await api('bundleIds',{type:'bundleIds',attributes:{identifier:bundle,name:'Life UI',platform:'MAC_OS'}})).data;
          const profiles=await api('profiles?filter[profileType]=MAC_APP_DIRECT&filter[name]=Life%20UI%20Developer%20ID&include=bundleId,certificates&limit=200');
          const valid=profiles.data.filter(p=>p.attributes.profileState==='ACTIVE'&&Date.parse(p.attributes.expirationDate)>Date.now()&&p.relationships.bundleId.data.id===app.id&&p.relationships.certificates.data.some(c=>c.id===cert.id));
          if(valid.length>1) throw Error('Ambiguous app profile');
          const profile=valid[0]??(await api('profiles',{type:'profiles',attributes:{name:'Life UI Developer ID',profileType:'MAC_APP_DIRECT'},relationships:{bundleId:{data:{type:'bundleIds',id:app.id}},certificates:{data:[{type:'certificates',id:cert.id}]}}})).data;
          await Bun.write(process.env.RUNNER_TEMP+'/profile-selection.json',JSON.stringify({uuid:profile.attributes.uuid,bundle}));
          console.log('Existing-certificate app profile selected');
          JS
          brew install xcodegen
          mkdir -p "$RUNNER_TEMP/probe-source"
          cp packages/LifeKit/Sources/LifeKit/HubCredentials.swift scripts/macos-keychain-probe.swift "$RUNNER_TEMP/probe-source/"
          cp apps/macos/Signing/LifeUI.entitlements "$RUNNER_TEMP/probe-source/"
          cat > "$RUNNER_TEMP/probe-source/project.yml" <<'YAML'
          name: KeychainProbe
          targets:
            KeychainProbe:
              type: application
              platform: macOS
              deploymentTarget: "14.0"
              sources: [HubCredentials.swift, macos-keychain-probe.swift]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.alexmiller.life-ui
                  GENERATE_INFOPLIST_FILE: YES
                  CODE_SIGN_STYLE: Automatic
                  CODE_SIGN_ENTITLEMENTS: LifeUI.entitlements
                  ENABLE_HARDENED_RUNTIME: YES
          YAML
          xcodegen generate --spec "$RUNNER_TEMP/probe-source/project.yml"
          xcodebuild -quiet -project "$RUNNER_TEMP/probe-source/KeychainProbe.xcodeproj" -scheme KeychainProbe \
            -configuration Release -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/KeychainProbe.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/life-ui-notary.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" archive
          python3 - "$TEAM_ID" "$RUNNER_TEMP/export.plist" "$IDENTITY_SHA" <<'PYTHON'
          import plistlib,sys
          with open(sys.argv[2], 'wb') as f:
              import json,os
              profile=json.load(open(os.environ['RUNNER_TEMP']+'/profile-selection.json'))
              plistlib.dump({'method':'developer-id','signingStyle':'manual','teamID':sys.argv[1],'signingCertificate':sys.argv[3],'provisioningProfiles':{profile['bundle']:profile['uuid']}},f)
          PYTHON
          xcodebuild -quiet -exportArchive -archivePath "$RUNNER_TEMP/KeychainProbe.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/life-ui-notary.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          python3 - "$RUNNER_TEMP/export/KeychainProbe.app" "$TEAM_ID" <<'PYTHON'
          import pathlib,plistlib,subprocess,sys,re
          app=pathlib.Path(sys.argv[1])
          result=subprocess.run(['codesign','-d','--entitlements','-','--xml',str(app)],capture_output=True)
          claims=plistlib.loads(result.stdout) if result.stdout.strip() else {}
          print('Export entitlement keys:', ', '.join(sorted(claims)) or '(none)',flush=True)
          info=plistlib.loads((app/'Contents/Info.plist').read_bytes())
          app_id=claims.get('com.apple.application-identifier','')
          print('App ID resolved:',bool(app_id and '$' not in app_id and app_id.endswith('.'+info['CFBundleIdentifier'])),flush=True)
          print('Team matches:',claims.get('com.apple.developer.team-identifier')==sys.argv[2],flush=True)
          profile=(app/'Contents/embedded.provisionprofile').is_file()
          print('Embedded profile present:',profile,flush=True)
          probe=subprocess.run([str(app/'Contents/MacOS/KeychainProbe')],capture_output=True,text=True,timeout=30)
          print('DP CRUD exit:',probe.returncode,flush=True)
          print('DP CRUD passed:',probe.returncode==0,flush=True)
          stage=re.search(r'Keychain probe stage: ([A-Za-z0-9 ()-]+)',probe.stderr)
          print('Keychain diagnostic stage:',stage.group(1) if stage else '(none)',flush=True)
          print('Keychain diagnostic statuses:',','.join(sorted(set(re.findall(r'-[0-9]{4,6}',probe.stderr)))) or '(none)',flush=True)
          # Diagnostic runs even without the profile; never waive the final gate.
          sys.exit(0 if profile and probe.returncode==0 else 1)
          PYTHON
      - name: Delete temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/life-ui-cert.p12" "$RUNNER_TEMP/life-ui-notary.p8"
          if [ -f "$RUNNER_TEMP/life-ui-release.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/life-ui-release.keychain-db"
          fi
