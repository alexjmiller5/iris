name: Build iOS Ad Hoc

on:
  workflow_dispatch:
    inputs:
      artifact_recipient:
        description: Public age recipient for this build (keep the private identity locally)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ios-adhoc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: oven-sh/setup-bun@v2
      - name: Install build tools
        run: brew install xcodegen age
      - name: Generate project
        run: xcodegen generate --spec apps/ios/project.yml
      - name: Stamp identifiable build
        shell: python
        run: |
          import os, pathlib, plistlib, re
          run = os.environ['GITHUB_RUN_NUMBER']
          attempt = os.environ['GITHUB_RUN_ATTEMPT']
          if not all(re.fullmatch(r'[1-9][0-9]*', value) for value in (run, attempt)):
              raise SystemExit('Invalid build identity')
          path = pathlib.Path('apps/ios/App/Info.plist')
          info = plistlib.loads(path.read_bytes())
          info['CFBundleVersion'] = f'{run}.{attempt}'
          path.write_bytes(plistlib.dumps(info))
      - uses: 1Password/install-cli-action@v4
      # Existing Apple Signing exception supplies iOS signing material only.
      - uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          IOS_CERTIFICATE_P12_BASE64: op://Apple Signing/Apple Distribution Cert/p12_base64
          IOS_CERTIFICATE_PASSWORD: op://Apple Signing/Apple Distribution Cert/password
          ASC_KEY_P8_BASE64: op://Apple Signing/App Store Connect API Key/p8_base64
          ASC_KEY_ID: op://Apple Signing/App Store Connect API Key/key_id
          ASC_ISSUER_ID: op://Apple Signing/App Store Connect API Key/issuer_id
          IOS_DEVICE_ID: op://Life UI/Life UI ENV/IOS_DEVICE_ID
      - name: Download app-specific Ad Hoc profile
        env:
          PROFILE_ID: ${{ vars.IOS_PROVISIONING_PROFILE_ID }}
        run: |
          bun - <<'JS'
          const {createPrivateKey,sign}=require('node:crypto');
          const {appendFileSync}=require('node:fs');
          if(!/^[A-Z0-9]+$/.test(process.env.PROFILE_ID??''))throw Error('App-specific profile ID required');
          const encode=v=>Buffer.from(JSON.stringify(v)).toString('base64url');
          const now=Math.floor(Date.now()/1000);
          const input=encode({alg:'ES256',kid:process.env.ASC_KEY_ID,typ:'JWT'})+'.'+encode({iss:process.env.ASC_ISSUER_ID,iat:now,exp:now+120,aud:'appstoreconnect-v1'});
          const key=createPrivateKey(Buffer.from(process.env.ASC_KEY_P8_BASE64,'base64'));
          const jwt=input+'.'+sign('sha256',Buffer.from(input),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');
          const response=await fetch('https://api.appstoreconnect.apple.com/v1/profiles/'+encodeURIComponent(process.env.PROFILE_ID),{headers:{Authorization:'Bearer '+jwt}});
          if(!response.ok)throw Error('Profile download HTTP '+response.status);
          const profile=(await response.json()).data.attributes;
          if(profile.profileType!=='IOS_APP_ADHOC'||profile.profileState!=='ACTIVE'||Date.parse(profile.expirationDate)<=Date.now()
            || !/^[A-Za-z0-9+/]+=*$/.test(profile.profileContent??''))throw Error('Active app-specific Ad Hoc profile required');
          console.log('::add-mask::'+profile.profileContent);
          appendFileSync(process.env.GITHUB_ENV,'IOS_PROFILE_BASE64='+profile.profileContent+'\n');
          JS
      - name: Sign and verify Ad Hoc IPA
        run: |
          test -n "$IOS_DEVICE_ID" || { echo 'Set IOS_DEVICE_ID in the project ENV item.' >&2; exit 1; }
          python3 scripts/sign-ios.py --project apps/ios/LifeUI.xcodeproj --scheme LifeUI --output "$RUNNER_TEMP/ios-output"
      - name: Verify exported build identity
        shell: python
        run: |
          import os, pathlib, plistlib, re, zipfile
          with zipfile.ZipFile(pathlib.Path(os.environ['RUNNER_TEMP']) / 'ios-output/App.ipa') as archive:
              paths = [p for p in archive.namelist() if re.fullmatch(r'Payload/[^/]+\.app/Info\.plist', p)]
              if len(paths) != 1:
                  raise SystemExit('Expected one app in the exported IPA')
              info = plistlib.loads(archive.read(paths[0]))
          expected = f"{os.environ['GITHUB_RUN_NUMBER']}.{os.environ['GITHUB_RUN_ATTEMPT']}"
          if info.get('CFBundleVersion') != expected:
              raise SystemExit('Exported build identity does not match this workflow run')
      - name: Encrypt verified IPA
        env:
          ARTIFACT_RECIPIENT: ${{ inputs.artifact_recipient }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/ios-artifact"
          age --encrypt --recipient "$ARTIFACT_RECIPIENT" \
            --output "$RUNNER_TEMP/ios-artifact/LifeUI.ipa.age" "$RUNNER_TEMP/ios-output/App.ipa"
      - name: Remove plaintext output
        if: always()
        shell: python
        run: |
          import os, pathlib, shutil
          shutil.rmtree(pathlib.Path(os.environ['RUNNER_TEMP']) / 'ios-output', ignore_errors=True)
      - uses: actions/upload-artifact@v4
        with:
          name: LifeUI-iOS-${{ github.sha }}
          path: ${{ runner.temp }}/ios-artifact/LifeUI.ipa.age
          retention-days: 1
          if-no-files-found: error
