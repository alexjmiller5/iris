name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    # The one GH secret: this project's 1Password service-account token, set by
    # op-project-bootstrap. Until it exists the job reports a notice and skips.
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - if: env.OP_SERVICE_ACCOUNT_TOKEN == ''
        run: echo "::notice::Deployment skipped; run op-project-bootstrap for this repository first."
      - if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        uses: actions/checkout@v7.0.1
      - if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        uses: oven-sh/setup-bun@v2
      - if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        uses: 1Password/install-cli-action@v4
      # op:// refs are BY NAME on purpose: op-project-bootstrap parses this file
      # to provision and verify the vault and items. Do not convert them to IDs.
      - if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          CLOUDFLARE_API_TOKEN: op://Life UI/Life UI CI Cloudflare Token/api-token
          CLOUDFLARE_ACCOUNT_ID: op://Life UI/Life UI CI Cloudflare Token/account-id
      - if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        run: bun install --frozen-lockfile
      - if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        run: bun run test
      - if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        run: bun run build
      - if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        working-directory: apps/web
        run: bunx wrangler deploy
